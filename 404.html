<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>Page Not Found | TCQ Consulting LLC</title>

  

  <style>
    :root {
      --text: #1c1c1e;
      --secondary: #6e6e73;
      --accent: #007aff;
      --surface: #f5f5f7;
      --border: #e5e5ea;
      --background: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      line-height: 1.7;
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 36px 24px 48px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 44px;
      color: var(--accent);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
    }

    .back-link:hover,
    .support-card a:hover,
    footer a:hover {
      text-decoration: underline;
    }

    header {
      margin-bottom: 46px;
      text-align: center;
    }

    h1 {
      font-size: clamp(36px, 7vw, 52px);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -1.5px;
    }

    .subtitle {
      max-width: 560px;
      margin: 14px auto 0;
      color: var(--secondary);
      font-size: 18px;
    }

    .support-card {
      margin-top: 38px;
      padding: 30px;
      border-radius: 22px;
      background: var(--surface);
    }

    .support-card h2 {
      margin-bottom: 10px;
      font-size: 22px;
      line-height: 1.3;
    }

    .support-card p + p {
      margin-top: 14px;
    }

    .support-card ul {
      margin-top: 16px;
      padding-left: 24px;
    }

    .support-card li + li {
      margin-top: 8px;
    }

    .email-section {
      margin-top: 42px;
      text-align: center;
    }

    .email-section h2 {
      margin-bottom: 10px;
      font-size: 22px;
    }

    .email-link {
      display: inline-block;
      margin-top: 8px;
      color: var(--accent);
      font-size: 18px;
      font-weight: 700;
      overflow-wrap: anywhere;
      text-decoration: none;
    }

    .response-note {
      max-width: 560px;
      margin: 14px auto 0;
      color: var(--secondary);
    }

    .apps-section {
      margin-top: 48px;
      text-align: center;
    }

    .apps-section h2 {
      margin-bottom: 14px;
      font-size: 22px;
    }

    .app-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 18px;
      color: var(--secondary);
    }

    a {
      color: var(--accent);
    }

    footer {
      margin-top: 64px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
      color: var(--secondary);
      text-align: center;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 18px;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .signature {
      margin-top: 18px;
      font-size: 14px;
    }

    .back-link:focus-visible,
    a:focus-visible {
      border-radius: 6px;
      outline: 3px solid rgba(0, 122, 255, 0.3);
      outline-offset: 4px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 28px 18px 40px;
      }

      .back-link {
        margin-bottom: 34px;
      }

      header {
        margin-bottom: 36px;
      }

      .support-card {
        padding: 24px 22px;
      }

      .app-list {
        flex-direction: column;
        gap: 6px;
      }
    }
  </style>

<meta name="description" content="Find TCQ Consulting LLC iPhone apps or contact support.">
